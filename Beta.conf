RULE-SET,https://magicrule.pages.dev/data/_shared/artifacts/OpenAI_rules_f362ba1006ae0e0c.list,OpenAI,no-resolve
RULE-SET,https://magicrule.pages.dev/data/_shared/artifacts/Grok_rules_1686b96ebfe522d0.list,xAI,no-resolve
RULE-SET,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/refs/heads/main/rules/shadowrocket/meta-ai.list,Meta,no-resolve
# Global
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt,PROXY,no-resolve
# NTP
